fp", "relation": "plots correlations for", "title": "plots correlations for"}, {"from": "m_clock", "to": "t_age", "relation": "plots correlations for", "title": "plots correlations for"}, {"from": "m_clock", "to": "cc_corr", "relation": "computes", "title": "computes"}];
const COMMUNITY_META = {"0": {"name": "Methods", "color": "#4E79A7"}, "1": {"name": "Core pGNN", "color": "#F28E2B"}, "2": {"name": "Correlation weighting", "color": "#E15759"}, "3": {"name": "VAE", "color": "#76B7B2"}, "4": {"name": "GMVAE", "color": "#59A14F"}, "5": {"name": "UMAP / Mapper", "color": "#EDC948"}, "6": {"name": "Datasets", "color": "#B07AA1"}, "7": {"name": "Targets", "color": "#FF9DA7"}, "8": {"name": "Evaluation", "color": "#9C755F"}};
const nodes = new vis.DataSet(RAW_NODES);
const edges = new vis.DataSet(RAW_EDGES.map((e,i)=>({id:i,from:e.from,to:e.to,title:e.relation,label:'',color:{color:'#555770',highlight:'#d9d9e8'},width:1.2,smooth:{type:'continuous'}})));
const container=document.getElementById('graph');
const data={nodes,edges};
const options={physics:{solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-65,centralGravity:.012,springLength:125,springConstant:.045,damping:.5,avoidOverlap:.8},stabilization:{iterations:600}},interaction:{hover:true,multiselect:true,navigationButtons:true,keyboard:true},nodes:{shape:'dot'},edges:{selectionWidth:2.5},layout:{improvedLayout:true}};
const network=new vis.Network(container,data,options);
const active=new Set(Object.keys(COMMUNITY_META));
function refresh(){const upd=RAW_NODES.map(n=>({id:n.id,hidden:!active.has(String(n.community))}));nodes.update(upd);document.querySelectorAll('.legend-item').forEach(el=>el.classList.toggle('dimmed',!active.has(el.dataset.c)));}
function buildLegend(){const leg=document.getElementById('legend');Object.keys(COMMUNITY_META).forEach(c=>{const meta=COMMUNITY_META[c],count=RAW_NODES.filter(n=>String(n.community)===c).length;const d=document.createElement('div');d.className='legend-item';d.dataset.c=c;d.innerHTML=`<span class="legend-dot" style="background:${meta.color}"></span><span class="legend-label">${meta.name}</span><span class="legend-count">${count}</span>`;d.onclick=()=>{active.has(c)?active.delete(c):active.add(c);refresh()};leg.appendChild(d)})}
function inspect(id){const n=RAW_NODES.find(x=>x.id===id);if(!n)return;const neigh=network.getConnectedNodes(id);let html=`<div class="field"><b>${n.label}</b></div><div class="field"><b>Community:</b> ${n.community_name}</div><div class="field"><b>Type:</b> ${n.file_type}</div><div class="field"><b>Source:</b> ${n.source_file||'—'}</div><div class="field"><b>Degree:</b> ${n.degree}</div><div class="field"><b>Connections:</b></div>`;for(const x of neigh){const q=RAW_NODES.find(y=>y.id===x);if(q)html+=`<span class="neighbor-link" onclick="focusNode('${x}')">${q.label}</span>`}document.getElementById('info-content').innerHTML=html}
function focusNode(id){network.selectNodes([id]);network.focus(id,{scale:1.25,animation:true});inspect(id)}
network.on('click',p=>{if(p.nodes.length)inspect(p.nodes[0])});
function showAll(){Object.keys(COMMUNITY_META).forEach(c=>active.add(c));refresh();network.fit({animation:true})}
function showMethods(){active.clear();active.add('0');active.add('5');refresh();network.fit({animation:true})}
const search=document.getElementById('search'),results=document.getElementById('search-results');search.addEventListener('input',()=>{const q=search.value.toLowerCase().trim();results.innerHTML='';if(!q){results.style.display='none';return}const hits=RAW_NODES.filter(n=>n.label.toLowerCase().includes(q)).slice(0,12);for(const n of hits){const d=document.createElement('div');d.className='search-item';d.textContent=n.label;d.onclick=()=>{focusNode(n.id);results.style.display='none';search.value=n.label};results.appendChild(d)}results.style.display=hits.length?'block':'none'});
buildLegend();document.getElementById('stats').innerHTML=`${RAW_NODES.length} nodes &middot; ${RAW_EDGES.length} edges &middot; ${Object.keys(COMMUNITY_META).length} communities`;setTimeout(()=>network.fit({animation:true}),700);

function toggleTheme(){
  const light=document.body.classList.toggle('light');
  document.getElementById('theme-btn').textContent=light?'Dark mode':'Light mode';
  network.setOptions({edges:{color:{color:light?'#8792a6':'#555577',highlight:light?'#111827':'#ffffff'},font:{color:light?'#374151':'#888888'}}});
  network.redraw();
}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function downloadJSON(){saveBlob(new Blob([JSON.stringify({directed:true,multigraph:false,nodes:RAW_NODES,links:RAW_EDGES,communities:COMMUNITIES},null,2)],{type:'application/json'}),'graphify_all_9_models_datasets_v2.json');}
function downloadPNG(){network.fit({animation:false});setTimeout(()=>{const c=document.querySelector('#graph canvas');if(!c){alert('Graph canvas is not ready.');return;}c.toBlob(b=>b&&saveBlob(b,'graphify_all_9_models_datasets_v2.png'),'image/png');},180);}
